name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, since the mod API is early access and can change between Claude Code releases.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Show version
        run: claude --version

      - name: Validate the plugin and marketplace
        run: claude plugin validate .

      - name: Run the tests
        run: claude plugin test .
